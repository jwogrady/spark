name: agents-md
namespace: spark.skills.agents-md
feature_id: FEAT-SPARK-AGENTS-MD-001
bounded_context: Spark AI agent workspace
status: draft

description: |
  Generates and maintains AGENTS.md files for Spark-managed project repos.
  AGENTS.md is the tool-agnostic companion to CLAUDE.md — the behavioral
  contract for any AI coding agent regardless of vendor or tool. Reads both
  CLAUDE.md and any existing AGENTS.md before generating output. Flags drift
  between the two files rather than silently resolving it.

model: gpt-4o
temperature: 0.2

