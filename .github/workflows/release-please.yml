# Spark's release mechanism (ADR-0009): Release Please maintains a release PR
# from the conventional commits on master; merging that PR — a human decision —
# produces the version bump (plugin.json via extra-files), the CHANGELOG entry,
# the tag, and the GitHub Release.
#
# Only the root package gets a "Latest" GitHub Release, so the repo's Latest
# always names the core plugin (ADR-0016 addendum). Companions publish as
# prereleases (prerelease: true) — GitHub never marks a prerelease as Latest —
# so Release Please creates their tags itself, atomically, at the moment it
# computes the next version range. That closes the orphan-release-PR race (#248)
# the old skip-github-release + post-hoc tagging step caused. Ship never cuts
# releases (ADR-0006).
name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Prefer a dedicated identity so the release PR it opens triggers CI
          # (the default GITHUB_TOKEN cannot trigger downstream workflows, which
          # leaves the release PR's validate run held as action_required — see
          # docs/reference/release-token-governance.md, #185). Falls back to the
          # default token when the secret is unset, so behavior is unchanged
          # until RELEASE_PLEASE_TOKEN is added.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
