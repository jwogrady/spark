# Spark-repo validation gate. The workflow is intentionally a thin wrapper
# around two locally-runnable commands, so CI and a contributor's machine can
# never drift: `spark doctor` is the static superset gate (layout, JSON,
# frontmatter, bash -n, doc links, enforcement lockstep) and `tests/run.sh` is
# the behavioral gate (the CLI flows and hooks exercised against temp repos).
# Do not add check logic here — extend doctor or add a tests/test-*.sh suite.
# The two gates: ADR-0011 (doctor, the static gate) and ADR-0018 (tests/run.sh,
# the behavioral gate). ADR-0005 covers how this differs from generated build CI.
name: validate

on:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./plugins/spark/bin/spark doctor
  tests:
    runs-on: ubuntu-latest
    steps:
      # Full history, because test-ledger-truth.sh verifies a release INTERVAL:
      # it derives the v0.21 tally from the baseline commit and the v0.21.0
      # release boundary (#567). At the default depth 1 neither ref is present,
      # so the check would honestly report "not verified" and guard nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Emit regenerated #743 evidence for #768
        run: |
          rm -rf /tmp/spark-743
          pin="$(sed -nE 's/^# observed at ([0-9a-f]{40})$/\\1/p' docs/research/v0.23-cleanup/743-responsibilities-before.tsv | head -1)"
          python3 docs/research/v0.23-cleanup/tools/build-responsibilities.py "$PWD" "$pin" --out=/tmp/spark-743 >/dev/null
          echo '===BEGIN_743_MAP==='
          cat /tmp/spark-743/docs/research/v0.23-cleanup/743-responsibilities.tsv
          echo '===END_743_MAP==='
          echo '===BEGIN_743_MANIFEST==='
          cat /tmp/spark-743/docs/research/v0.23-cleanup/743-runtime-surface.md
          echo '===END_743_MANIFEST==='
      - run: bash tests/run.sh
