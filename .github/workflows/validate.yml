# Spark-repo validation gate. The workflow is intentionally a thin wrapper:
# `spark doctor` is the superset local gate (layout, JSON, frontmatter,
# bash -n, doc links, enforcement parity), and CI runs the exact same
# command so the two can never drift. Do not add check logic here — extend
# doctor instead. See ADR-0005 (amended) for how this differs from
# Cosmic-generated build CI.
name: validate

on:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./plugins/spark/bin/spark doctor
