# Spark-repo validation gate. The workflow is intentionally a thin wrapper
# around two locally-runnable commands, so CI and a contributor's machine can
# never drift: `spark doctor` is the static superset gate (layout, JSON,
# frontmatter, bash -n, doc links, enforcement parity) and `tests/run.sh` is
# the behavioral gate (the CLI flows and hooks exercised against temp repos).
# Do not add check logic here — extend doctor or add a tests/test-*.sh suite.
# The two gates: ADR-0011 (doctor, the static gate) and ADR-0018 (tests/run.sh,
# the behavioral gate). ADR-0005 covers how this differs from generated build CI.
name: validate

on:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./plugins/spark/bin/spark doctor
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh
  # Capability-traceability enforcement (#301): a feat-titled PR must carry the
  # "Capability traceability" section — the CEF answer is required, not merely
  # invited. Decision logic lives in the script (tests/test-pr-traceability.sh
  # covers it); this stays a thin wrapper per the header rule.
  traceability:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/pr-traceability-check.sh
