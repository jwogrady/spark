# The Claude coding lane (#583).
#
# Woken by a TRUSTED HUMAN mentioning @claude. It may push fixes to the pull
# request's own feature branch. It may not merge, and it may not change what
# governs it.
#
# WHY THE ASSOCIATION GATE IS THE SECURITY BOUNDARY. `issue_comment` fires for
# anyone who can type a comment, and this job holds `contents: write`. Without a
# gate, any account able to comment could reach a write-capable path — the
# classic escalation shape. So the job runs only for OWNER, MEMBER or
# COLLABORATOR, and that check sits in `if:` where it is evaluated BEFORE any
# step runs and before credentials exist in the runner.
#
# Fork pull requests are refused for the same reason: code from an untrusted
# head must never execute where a write token is available.
#
# WHAT IT CANNOT DO, and why that is structural rather than a promise:
#
#   * merge — no permission grants it, and merging is the owner's act;
#   * change workflows — `workflows: write` is not granted, so GitHub itself
#     rejects a push touching .github/workflows/**. A lane that could edit its
#     own guardrails would have none;
#   * change rulesets, secrets or repository administration — `administration`
#     and `secrets` are not granted;
#   * review automatically — this lane is woken by a human, never by every PR.
#     Automatic independent review is #584's, and two automatic reviewers would
#     duplicate cost and findings without a governed reason.
#
# NOT HERE, DELIBERATELY: no `workflow_run` trigger. Waking this lane from a
# reviewer's verdict is the reviewer -> writer handoff, and #585 owns it. Landing
# it early would enable an automation path this issue is not authorised to turn
# on.
#
# Requires the CLAUDE_CODE_OAUTH_TOKEN secret. Absent it the job cannot run;
# the surface lands first and is armed by the repository owner.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Two conditions, both required: a trusted association, and an explicit
    # @claude mention. Neither alone is enough — a trusted human who did not ask
    # for Claude should not get it, and a mention from an untrusted account must
    # not reach a write-capable job.
    if: |
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR'
      ) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push fixes to the PR's own feature branch
      pull-requests: write   # comment and update the pull request
      issues: write          # comment on issues
      id-token: write
      actions: read          # read CI results
      # Deliberately absent: administration, secrets, and workflows. Their
      # absence is the control; nothing below re-grants them.
    steps:
      - name: Refuse untrusted heads
        # A fork's head is untrusted code. This job holds a write token, so the
        # refusal happens before checkout rather than being relied on later.
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${HEAD_REPO:-}" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "refusing: head $HEAD_REPO is not $BASE_REPO — a fork must not reach a write-capable lane" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            You are working inside the Spark repository, woken by a human
            mention.

            Make the smallest correct change on THIS feature branch, commit it
            with a Conventional Commit, and push. Never merge, and never open a
            new pull request.

            Never assign a milestone, priority, or backlog disposition to make a
            check go green.

            If the request needs a project judgment — scope, priority, release
            placement, or anything a recommendation cannot settle — reply naming
            the decision and the admissible options, and stop. A recommendation
            is not authority.

            If you cannot assess something, say what and why. NOT ASSESSED is
            never a pass.
