# The independent OpenAI reviewer lane (#584) — the single production automatic
# reviewer for the autonomous loop.
#
# SECURITY BOUNDARY: this workflow runs trusted base-branch code via
# pull_request_target. The PR HEAD, diff, body, issue text, comments, and check
# results are untrusted DATA only. No executable from the PR checkout is sourced
# or run while GITHUB_TOKEN or OPENAI_API_KEY is available.
name: OpenAI Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # Required-check completion re-fires the lane so a HEAD reserved while its CI was
  # still pending resumes and is reviewed from terminal state (#692). These are the
  # workflows that produce the required checks — never this reviewer itself, so
  # there is no self-trigger loop.
  workflow_run:
    workflows: [validate, docs-truth, milestone-gate]
    types: [completed]
  # Durable safety net: a scheduled sweep guarantees every reserved HEAD eventually
  # reaches a terminal disposition even if the completion path stranded it (retries
  # exhausted, a run killed after invoking, a transient fetch failure). It finalizes
  # NOT ASSESSED fail-closed, never invoking the model (#692).
  schedule:
    - cron: '17,47 * * * *'

# Serialize by exact HEAD SHA — reliably present in BOTH event payloads — so a
# pull_request_target run and a workflow_run run for the same commit never overlap,
# and the paid model call is invoked at most once per exact HEAD. Do not cancel an
# in-flight run: cancellation after the paid call could let a replacement re-invoke it.
concurrency:
  group: openai-review-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  openai-review:
    # Event-driven review; the scheduled sweep is the separate recover job.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      checks: read
      actions: read
    steps:
      # Both event types are supported: pull_request_target (a push/open) and
      # workflow_run (a required-check workflow finished). Resolve the target PR and
      # exact HEAD from whichever fired; workflow_run.pull_requests can be empty, so
      # fall back to resolving the open PR from the head SHA. No PR → nothing to do.
      - name: Resolve target PR and HEAD
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WR_HEAD: ${{ github.event.workflow_run.head_sha }}
          WR_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          pr=""; head=""
          if [ "$EVENT" = "pull_request_target" ]; then
            pr="$PR_NUM"; head="$PR_HEAD"
          else
            head="$WR_HEAD"; pr="$WR_PR"
            if [ -z "$pr" ] && [ -n "$head" ]; then
              pr="$(gh api "repos/$REPO/commits/$head/pulls" \
                --jq '[.[] | select(.state=="open")] | (.[0].number // "")' 2>/dev/null || echo "")"
            fi
          fi
          if [ -z "$pr" ] || [ -z "$head" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No open PR/HEAD to review for event=$EVENT; skipping."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted base implementation
        if: steps.target.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Claim exact PR HEAD, resuming a pending reservation
        id: guard
        if: steps.target.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.target.outputs.pr }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          . .github/scripts/openai-review/lib.sh
          mkdir -p /tmp/rev

          # Re-read live identity; queued events may already be stale.
          live_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          if [ "$live_head" != "$HEAD_SHA" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "reason=superseded-before-claim" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fetch every page once. FAIL CLOSED: if the comments cannot be read, an
          # existing invoked/final marker would look absent and a second paid call
          # could be made — so defer without claiming or invoking, and let a later
          # event retry. gh --paginate emits one JSON array PER PAGE, so normalize
          # the pages into a single array — otherwise a reservation found after page
          # one yields a multiline id and resumption silently breaks. Only claims
          # authored by the trusted Actions producer count; contributor text is inert.
          if ! gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
               > /tmp/rev/comments.raw.json 2>/dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "reason=comments-unreadable-defer" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -s 'add // []' /tmp/rev/comments.raw.json > /tmp/rev/comments.json
          jq -r '.[] | [.user.login, (.performed_via_github_app.slug // ""), .body] | @tsv' \
            /tmp/rev/comments.json > /tmp/rev/comment-claims.tsv

          # If the paid call was already CONSUMED for this exact HEAD — invoked
          # (pre-call marker) or fully reviewed (final marker) — never invoke it
          # again, even if a prior run died before finalizing. Only a bare
          # reservation is resumable.
          if orl_has_consumed "$PR" "$HEAD_SHA" < /tmp/rev/comment-claims.tsv; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "reason=already-consumed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A bare reservation (no final marker) means this HEAD was CLAIMED but not
          # yet reviewed — a prior run reserved it while CI was still pending. RESUME
          # by reusing that reservation instead of posting a second one, so a
          # completion event can finish the review from terminal state (#692).
          needle="<!-- $ORL_RESERVATION_TAG pr=$PR head=$HEAD_SHA -->"
          reservation_id="$(jq -r --arg l "$ORL_TRUSTED_LOGIN" --arg a "$ORL_TRUSTED_APP" --arg n "$needle" \
            '[.[] | select(.user.login==$l) | select((.performed_via_github_app.slug // "")==$a) | select(.body|contains($n)) | .id] | (.[0] // "") | tostring' \
            /tmp/rev/comments.json)"
          if [ -z "$reservation_id" ]; then
            reservation="$(orl_reservation "$PR" "$HEAD_SHA")"
            reservation_id="$(gh api --method POST "repos/$REPO/issues/$PR/comments" \
              -f body="$reservation" --jq '.id')"
          fi
          [ -n "$reservation_id" ]
          echo "already=false" >> "$GITHUB_OUTPUT"
          echo "reservation_id=$reservation_id" >> "$GITHUB_OUTPUT"

      # The one paid review must consume a TERMINAL exact-HEAD CI snapshot, never a
      # pending one that could freeze a pre-terminal verdict (#692). Read the
      # required checks: if terminal, review now; if not, produce NO verdict and stop
      # — the reservation stays pending and a workflow_run completion event resumes
      # this exact HEAD once the checks finish. The completion trigger, not a wait,
      # is the continuation; the short retry below only absorbs the seconds of
      # check-runs API propagation lag after the LAST required workflow completes, so
      # that terminal event does not miss terminality and strand the reservation.
      # On retry exhaustion it DEFERS (no verdict finalized), never freezes one.
      - name: Check required checks are terminal
        id: ci
        if: steps.target.outputs.skip != 'true' && steps.guard.outputs.already != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          . .github/scripts/openai-review/lib.sh
          mkdir -p /tmp/rev
          required="docs-truth doctor gate tests"
          terminal=false
          for attempt in 1 2 3 4 5 6; do
            # Paginate: a PR with many checks can push a required run past page one,
            # which would read as missing and strand the reservation.
            gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '.check_runs[] | "\(.name): \(.status)/\(.conclusion // "pending")"' \
              > /tmp/rev/checks.txt 2>/dev/null || : > /tmp/rev/checks.txt
            if orl_checks_terminal $required < /tmp/rev/checks.txt; then terminal=true; break; fi
            [ "$attempt" -lt 6 ] && sleep 20 || true
          done
          # Only gate whether to gather+consider this HEAD; the ask step re-validates
          # terminality AND greenness immediately before the paid call (the snapshot
          # here can go stale), so green is decided there, not cached.
          if [ "$terminal" = "true" ]; then
            echo "terminal=true" >> "$GITHUB_OUTPUT"
          else
            echo "terminal=false" >> "$GITHUB_OUTPUT"
            echo "Required checks not yet terminal for $HEAD_SHA; the reservation stays pending until a completion event resumes it."
          fi

      - name: Gather untrusted review evidence as data
        if: steps.guard.outputs.already != 'true' && steps.ci.outputs.terminal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.target.outputs.pr }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        run: |
          set -euo pipefail
          . .github/scripts/openai-review/lib.sh
          mkdir -p /tmp/rev

          # Fetch the FULL diff first so truncation can be detected, then bound it
          # for the request. A prefix is never silently treated as the whole
          # change: truncation is disclosed as machine-readable completeness
          # evidence, the complete changed-file manifest is always included, and a
          # post-step control forbids PASS on a truncated diff (#693).
          # A refused fetch (e.g. GitHub 406 on a very large diff) is itself an
          # incomplete review, not a complete zero-byte one: capture the outcome
          # so the sentinel body can never be disclosed as a COMPLETE diff (#693).
          if gh api "repos/$REPO/pulls/$PR" -H "Accept: application/vnd.github.v3.diff" \
               > /tmp/rev/diff.raw 2>/dev/null; then
            diff_ok=1
          else
            diff_ok=0
            echo "(diff unavailable)" > /tmp/rev/diff.raw
          fi
          budget=200000

          # The changed-file manifest is ALWAYS supplied to the reviewer (as
          # untrusted PR data — filenames are attacker-controlled) and must name
          # EVERY changed file (#693, criterion 3). The REST files endpoint caps at
          # 3000, so the manifest is retrieved via GraphQL cursor pagination, which
          # is uncapped and — a pure API query on the trusted base runner, with no
          # checkout of and no code execution from the PR head — preserves
          # trusted-base execution (#693, criterion 6). Filenames are @json-escaped
          # so an embedded newline (git permits them) can neither split one record
          # into several counted lines nor inject a line into the prompt.
          owner="${REPO%%/*}"; name="${REPO#*/}"
          changed_files="$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files' 2>/dev/null || echo '')"
          if gh api graphql --paginate \
               -f query='query($owner:String!,$name:String!,$pr:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$pr){files(first:100,after:$endCursor){pageInfo{hasNextPage endCursor} nodes{path additions deletions changeType}}}}}' \
               -f owner="$owner" -f name="$name" -F pr="$PR" \
               --jq '.data.repository.pullRequest.files.nodes[] | "\(.changeType)\t\(.path|@json)\t+\(.additions)/-\(.deletions)"' \
               > /tmp/rev/files.txt 2>/dev/null; then
            manifest_fetch_ok=1
          else
            manifest_fetch_ok=0
            echo "(file manifest unavailable)" > /tmp/rev/files.txt
          fi

          # Derive the bounded diff, the fail-closed completeness flag, and the
          # trusted machine-generated status from the fetched evidence. Extracted
          # into a tested helper so real byte-boundary and manifest fixtures
          # exercise the handling directly, not a numeric proxy (#693). A
          # successful empty manifest counts as zero records and is complete only
          # when changed_files is zero; only a FAILED fetch is unavailable.
          orl_build_evidence /tmp/rev/diff.raw "$diff_ok" "$budget" \
            /tmp/rev/files.txt "$manifest_fetch_ok" "$changed_files" /tmp/rev

          gh api "repos/$REPO/pulls/$PR" --jq '"TITLE: \(.title)\n\nBODY:\n\(.body // "")"' \
            > /tmp/rev/pr.txt 2>/dev/null || echo "(pr unavailable)" > /tmp/rev/pr.txt

          : > /tmp/rev/issue.txt
          for n in $(orl_closing_issues < /tmp/rev/pr.txt); do
            gh api "repos/$REPO/issues/$n" \
              --jq '"ISSUE #\(.number): \(.title)\nLABELS: \([.labels[].name]|join(","))\nMILESTONE: \(.milestone.title // "none")\n\n\(.body // "")"' \
              >> /tmp/rev/issue.txt 2>/dev/null || true
          done
          [ -s /tmp/rev/issue.txt ] || echo "(no closing issue reference found in the PR body)" > /tmp/rev/issue.txt

          gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | "\(.name): \(.status)/\(.conclusion // "pending")"' \
            > /tmp/rev/checks.txt 2>/dev/null || echo "(checks unavailable)" > /tmp/rev/checks.txt

          gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | "\(.user.login): \(.body)"' > /tmp/rev/comments-all.txt 2>/dev/null || : > /tmp/rev/comments-all.txt
          tail -c 40000 /tmp/rev/comments-all.txt > /tmp/rev/comments.txt

          # Deterministic Spark evidence comes from the trusted base checkout,
          # never the PR HEAD. It describes the governing implementation only;
          # the PR change itself is inspected as diff/check data above.
          ./plugins/spark/bin/spark doctor > /tmp/rev/doctor.txt 2>&1 || true
          ./plugins/spark/bin/spark governance validate --tsv > /tmp/rev/gov.txt 2>&1 || true
          tail -c 20000 /tmp/rev/gov.txt > /tmp/rev/g.trim && mv /tmp/rev/g.trim /tmp/rev/gov.txt

      - name: Ask the reviewer
        id: ask
        if: steps.guard.outputs.already != 'true' && steps.ci.outputs.terminal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR: ${{ steps.target.outputs.pr }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          RESERVATION_ID: ${{ steps.guard.outputs.reservation_id }}
        run: |
          set -euo pipefail
          . .github/scripts/openai-review/lib.sh
          required="docs-truth doctor gate tests"

          # Re-validate the required checks IMMEDIATELY before consuming the paid
          # call — the ci step's terminal/green snapshot is now stale: a check could
          # have been re-run or gone pending since (#692 TOCTOU). Re-fetch the full
          # paginated set into checks.txt (so the reviewed evidence reflects THIS
          # snapshot too). If a check is no longer terminal, DEFER — write no verdict
          # and leave the reservation resumable for the next completion event.
          gh api --paginate "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | "\(.name): \(.status)/\(.conclusion // "pending")"' \
            > /tmp/rev/checks.txt 2>/dev/null || : > /tmp/rev/checks.txt
          if ! orl_checks_terminal $required < /tmp/rev/checks.txt; then
            echo "defer=true" >> "$GITHUB_OUTPUT"
            echo "A required check became non-terminal before invocation; deferring, reservation stays resumable."
            exit 0
          fi
          # Terminal but not all green: a failed/cancelled required check means this
          # HEAD cannot PASS. Finalize NOT ASSESSED without spending the model call.
          if ! orl_checks_passed $required < /tmp/rev/checks.txt; then
            printf 'NOT ASSESSED\n\nOne or more required checks are not green on this exact HEAD, so it cannot pass review. This is not a pass; fix the failing checks.\n' > /tmp/rev/verdict.md
            printf '0' > /tmp/rev/latency.txt
            exit 0
          fi

          # Last TOCTOU check before any paid invocation. The durable reservation
          # remains evidence that this old HEAD was claimed, but no stale model
          # result is produced.
          live_head="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          if [ "$live_head" != "$HEAD_SHA" ]; then
            printf 'NOT ASSESSED\n\nThis HEAD was superseded before reviewer invocation; no model call was made.\n' > /tmp/rev/verdict.md
            printf '0' > /tmp/rev/latency.txt
            exit 0
          fi

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            printf 'NOT ASSESSED\n\nOPENAI_API_KEY is not available to this run, so no review was performed. An unread surface is not a pass.\n' > /tmp/rev/verdict.md
            printf '0' > /tmp/rev/latency.txt
            exit 0
          fi

          # Binding policy is TRUSTED, committed, base-checkout code. It is read
          # from the trusted base tree rather than inlined, where a column-0
          # heredoc body would break this run: block's YAML.
          cp .github/scripts/openai-review/reviewer-instructions.txt /tmp/rev/instructions.txt

          {
            echo "=== UNTRUSTED ISSUE CONTRACT DATA ==="; cat /tmp/rev/issue.txt
            echo; echo "=== UNTRUSTED PULL REQUEST DATA ==="; cat /tmp/rev/pr.txt
            echo; echo "=== CHECK DATA FOR EXACT HEAD ==="; cat /tmp/rev/checks.txt
            echo; echo "=== TRUSTED-BASE SPARK DOCTOR EVIDENCE ==="; cat /tmp/rev/doctor.txt
            echo; echo "=== TRUSTED-BASE SPARK GOVERNANCE EVIDENCE ==="; cat /tmp/rev/gov.txt
            echo; echo "=== UNTRUSTED EXISTING COMMENT DATA ==="; cat /tmp/rev/comments.txt
            echo; echo "=== DIFF COMPLETENESS STATUS (trusted, machine-generated) ==="; cat /tmp/rev/completeness.txt
            echo; echo "=== UNTRUSTED CHANGED-FILE MANIFEST (PR-controlled filenames) ==="; cat /tmp/rev/files.txt
            echo; echo "=== UNTRUSTED PR DIFF DATA ==="; cat /tmp/rev/diff.txt
          } > /tmp/rev/input.txt

          jq -n --arg m "gpt-5.6-sol" --rawfile instructions /tmp/rev/instructions.txt --rawfile input /tmp/rev/input.txt \
            '{model: $m, instructions: $instructions, input: $input}' > /tmp/rev/req.json

          # Durably record that the paid call is being CONSUMED for this exact HEAD
          # BEFORE making it, by transitioning the reservation comment to carry the
          # invoked marker. If this run then dies before finalization, a later
          # completion event sees the call was consumed (guard's orl_has_consumed)
          # and does not invoke the model again (#692). The marker carries no
          # verdict, so #585 never reads it as an outcome; finalize overwrites it.
          [ -n "$RESERVATION_ID" ]
          consumed_body="$(orl_reservation "$PR" "$HEAD_SHA") $(orl_invoked "$PR" "$HEAD_SHA")"
          gh api --method PATCH "repos/$REPO/issues/comments/$RESERVATION_ID" \
            -f body="$consumed_body" >/dev/null

          metrics=$(curl -sS -o /tmp/rev/resp.json -w '%{http_code} %{time_total}' \
            https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            --data @/tmp/rev/req.json) || metrics="000 0"
          code="${metrics%% *}"
          printf '%s' "${metrics##* }" > /tmp/rev/latency.txt

          if [ "$code" != "200" ]; then
            printf 'NOT ASSESSED\n\nThe reviewer could not be reached (HTTP %s), so this change was not reviewed. That is not a pass.\n' "$code" > /tmp/rev/verdict.md
            exit 0
          fi

          jq -r '.output_text // ([.output[]?.content[]?.text] | map(select(. != null)) | join("\n")) // ""' \
            /tmp/rev/resp.json > /tmp/rev/verdict.md 2>/dev/null || : > /tmp/rev/verdict.md
          if [ ! -s /tmp/rev/verdict.md ]; then
            printf 'NOT ASSESSED\n\nThe reviewer returned no readable text, so this change was not reviewed.\n' > /tmp/rev/verdict.md
          fi

      # Runs even if the Ask step ERRORED (!cancelled): if the model call was
      # consumed (invoked marker written) but the run then failed, this still
      # finalizes a terminal disposition — an empty/unwritten verdict.md normalizes
      # to NOT ASSESSED — so the HEAD is never left invoked-but-unfinalized (#692).
      - name: Finalize the reserved review
        if: '!cancelled() && steps.guard.outputs.already != ''true'' && steps.ci.outputs.terminal == ''true'' && steps.ask.outputs.defer != ''true'''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.target.outputs.pr }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          RESERVATION_ID: ${{ steps.guard.outputs.reservation_id }}
        run: |
          set -euo pipefail
          . .github/scripts/openai-review/lib.sh
          [ -n "$RESERVATION_ID" ]

          model_verdict="$(head -1 /tmp/rev/verdict.md | orl_normalize_verdict)"
          # A PASS on a truncated diff is not a pass: the whole change was not
          # seen (#693). Downgrade it, and make the body say why.
          # Fail closed: an unreadable completeness flag is treated as truncated,
          # so a missing flag can only ever downgrade a would-be PASS (#693).
          truncated="$(cat /tmp/rev/truncated 2>/dev/null || echo 1)"
          verdict="$(orl_enforce_completeness "$model_verdict" "$truncated")"
          if [ "$verdict" != "$model_verdict" ]; then
            {
              printf 'NOT ASSESSED\n\nThe reviewer returned %s, but the review evidence was incomplete: the exact-HEAD diff exceeded the budget and was truncated or could not be fetched, and/or the changed-file manifest was unavailable, so the whole change was not seen. A pass on incomplete evidence is not a pass; a full review needs the complete diff and manifest on this exact HEAD.\n' "$model_verdict"
            } > /tmp/rev/verdict.md
          fi
          {
            orl_marker "$verdict" "$PR" "$HEAD_SHA"; echo
            echo "## Reviewer verdict: $verdict"
            echo
            orl_route "$verdict"
            echo
            echo "---"
            echo
            cat /tmp/rev/verdict.md
            echo
            echo "---"
            echo "_Independent reviewer for HEAD \`$HEAD_SHA\`. It cannot edit code, push, merge, or assign roadmap metadata._"
          } > /tmp/rev/body.md

          # Finalize the existing durable reservation. Publication failure is a
          # visible workflow failure; it is never swallowed and never reported as
          # if a verdict were posted.
          jq -n --rawfile body /tmp/rev/body.md '{body:$body}' | \
            gh api --method PATCH "repos/$REPO/issues/comments/$RESERVATION_ID" --input - >/dev/null

          latency="$(cat /tmp/rev/latency.txt 2>/dev/null || echo n/a)"
          tokens="$(jq -r '.usage.total_tokens // "n/a"' /tmp/rev/resp.json 2>/dev/null || echo n/a)"
          {
            echo "verdict=$verdict"
            echo "head=$HEAD_SHA"
            echo "model=gpt-5.6-sol"
            echo "latency_s=$latency"
            echo "total_tokens=$tokens"
          } >> "$GITHUB_STEP_SUMMARY"

  # Scheduled fail-closed recovery (#692): guarantee a terminal disposition for any
  # reserved HEAD the event-driven path stranded — retries exhausted, a run killed
  # after invoking, or a transient fetch failure. It NEVER invokes the model; it
  # only finalizes NOT ASSESSED for a reservation/invoked marker that, after a grace
  # window well past the completion + retry window, still has no final verdict on the
  # PR's LIVE head. This is the durable retry the completion trigger alone cannot
  # promise; the grace window keeps it from racing a normal in-flight review.
  recover:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: openai-review-recover
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout trusted base implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Finalize stranded reservations fail-closed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          . .github/scripts/openai-review/lib.sh
          grace=1800   # 30 min: well past the completion + retry window
          now="$(date +%s)"
          tab="$(printf '\t')"
          gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
            --jq '.[] | "\(.number)\t\(.head.sha)"' > /tmp/prs.txt 2>/dev/null || : > /tmp/prs.txt
          while IFS="$tab" read -r pr head; do
            [ -n "$pr" ] && [ -n "$head" ] || continue
            # Fail closed: if comments are unreadable, skip this PR (retry next sweep).
            gh api --paginate "repos/$REPO/issues/$pr/comments?per_page=100" \
              > /tmp/c.raw 2>/dev/null || continue
            jq -s 'add // []' /tmp/c.raw > /tmp/c.json
            jq -r '.[] | [.user.login, (.performed_via_github_app.slug // ""), .body] | @tsv' \
              /tmp/c.json > /tmp/c.tsv
            orl_needs_recovery "$pr" "$head" < /tmp/c.tsv || continue
            # Locate the reservation comment (id + created_at) for this exact head.
            needle="<!-- $ORL_RESERVATION_TAG pr=$pr head=$head -->"
            row="$(jq -r --arg l "$ORL_TRUSTED_LOGIN" --arg a "$ORL_TRUSTED_APP" --arg n "$needle" \
              '[.[] | select(.user.login==$l) | select((.performed_via_github_app.slug // "")==$a) | select(.body|contains($n)) | "\(.id)\t\(.created_at)"] | (.[0] // "")' \
              /tmp/c.json)"
            [ -n "$row" ] || continue
            cid="${row%%"$tab"*}"; created="${row#*"$tab"}"
            created_epoch="$(date -d "$created" +%s 2>/dev/null || echo 0)"
            [ "$created_epoch" -gt 0 ] || continue
            [ $(( now - created_epoch )) -ge "$grace" ] || continue
            # Fail-closed terminal disposition, no model call.
            note="This exact HEAD was reserved but the reviewer never finalized a verdict before the completion path was exhausted, so a scheduled recovery finalized NOT ASSESSED without invoking the model. This is not a pass; push a new commit or re-request review."
            body="$(printf '%s\n\n%s' "$(orl_marker 'NOT ASSESSED' "$pr" "$head")" "$note")"
            # A single PATCH failure must not abort the sweep, but it is logged and
            # retried on the next scheduled run — never silently swallowed.
            if ! gh api --method PATCH "repos/$REPO/issues/comments/$cid" -f body="$body" >/dev/null; then
              echo "recovery PATCH failed for PR $pr ($head); the next sweep retries."
            fi
          done < /tmp/prs.txt
