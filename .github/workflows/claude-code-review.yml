# The Claude review lane. Read-only over the repository by construction:
# `contents: read`, and the only tool it may use is the inline-comment MCP.
# It reviews; it never edits, pushes or merges.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read         # review only — never write
      pull-requests: write   # post the review
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The allow-list is the enforcement: no Bash, no file edits, one tool.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
