name: Feature
description: Propose a new feature for Spark.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One atomic feature per issue. If you have two ideas, open two issues.

  - type: input
    id: feature_id
    attributes:
      label: Feature ID
      description: "e.g. FEAT-SPARK-FOO-001"
      placeholder: FEAT-SPARK-FOO-001
    validations:
      required: false

  - type: input
    id: namespace
    attributes:
      label: Namespace
      description: "e.g. spark.skills.foo"
      placeholder: spark.skills.foo
    validations:
      required: false

  - type: input
    id: bounded_context
    attributes:
      label: Bounded Context
      description: The domain this feature belongs to.
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Be specific.
    validations:
      required: true

  - type: textarea
    id: proposed_behavior
    attributes:
      label: Proposed Behavior
      description: What should Spark do? Describe the behavior, not the implementation.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Checkboxes that define done.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: What is explicitly out of scope for this issue?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Maps to the repo's P0–P3 labels.
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: The theme this issue belongs to. Maps to the existing theme labels where one exists.
      options:
        - Product Identity
        - Preferences
        - Carry-In
        - Carry-Forward
        - DX
        - UX
        - Enforcement
        - Docs Truth
        - Skill Quality
        - Agent Quality
        - Architecture
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: >
        List "Blocked by" / "Blocks" relationships. Dependencies MUST use real
        GitHub issue numbers (e.g. "Blocked by #86") — never draft-local or
        slate-local numbering.
      placeholder: |
        Blocked by: #86
        Blocks: #90
    validations:
      required: false

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Rough effort estimate.
      options:
        - S
        - M
        - L
    validations:
      required: false

  - type: checkboxes
    id: attribution
    attributes:
      label: Attribution
      options:
        - label: >
            I will not credit AI systems in any commit, PR, comment, doc, or generated file.
            Credit belongs to the author.
          required: true
