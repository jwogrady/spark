name: Skill
description: Propose a new Spark skill.
labels: ["skill", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Skills live in `skills/<name>/`. Scaffold with `spark new-skill <name>`.
        Each skill requires a `SKILL.md` with `name` + `description` frontmatter.
        `references/` and `agents/` are optional.

        The `description` is the only thing Claude sees when choosing the skill —
        name concrete triggers ("Use when …").

  - type: input
    id: skill_name
    attributes:
      label: Skill name
      placeholder: "e.g. fork-init"
    validations:
      required: true

  - type: input
    id: namespace
    attributes:
      label: Namespace
      placeholder: "e.g. spark.skills.fork-init"
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or gap does this skill address?
    validations:
      required: true

  - type: textarea
    id: proposed_behavior
    attributes:
      label: Proposed Behavior
      description: What will the skill do? What outputs will it produce?
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      value: |
        - [ ] Add `skills/<name>/SKILL.md` with `name` + `description` frontmatter
        - [ ] `spark doctor` reports the skill as well-formed
        - [ ] Maps to a clear use case (and a lifecycle stage, if applicable)
        - [ ] No invented commands or fake integrations
        - [ ] No AI attribution in any file
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: Source (if imported)
      description: URL of the original skill if this is imported from another repo.
    validations:
      required: false

  - type: checkboxes
    id: attribution
    attributes:
      label: Attribution
      options:
        - label: >
            I will not credit AI systems in any commit, PR, comment, doc, or generated file.
            Credit belongs to the author.
          required: true
