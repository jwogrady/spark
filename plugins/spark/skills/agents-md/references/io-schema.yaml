input_schema:
  type: object
  properties:
    repo_name:
      type: string
      description: The name of the project repo.
    repo_description:
      type: string
      description: What the project does and why it exists.
    existing_agents_md:
      type: string
      description: >
        Full text of the existing AGENTS.md if one already exists.
        Required for update or audit mode.
    existing_claude_md:
      type: string
      description: >
        Full text of CLAUDE.md. Used to derive rules and detect drift.
        Strongly recommended for all modes.
    primary_language:
      type: string
      description: The main programming language.
    package_manager:
      type: string
      description: "Package/environment manager. Examples: uv, pip, npm, cargo."
    formatter:
      type: string
      description: "Code formatter. Examples: Black, Prettier, rustfmt."
    linter:
      type: string
      description: "Code linter. Examples: Ruff, ESLint, clippy."
    test_command:
      type: string
      description: The actual shell command to run the test suite.
    is_spark_repo:
      type: boolean
      description: >
        True if this repo is a Spark-managed project. Controls whether
        Skill Authoring Quick Reference section is included.
      default: false
    output_mode:
      type: string
      enum:
        - full_generation
        - section_patch
        - sync_audit
        - diff_review
      description: What the skill should produce.
      default: full_generation
  required: []

output_schema:
  type: object
  properties:
    mode:
      type: string
      description: The output mode that was used.
    content:
      type: string
      description: The generated AGENTS.md text, section patch, or audit report.
    drift_warnings:
      type: array
      items:
        type: string
      description: >
        Rules or sections that differ between AGENTS.md and CLAUDE.md.
        Empty if no drift detected or if CLAUDE.md was not provided.
    missing_inputs:
      type: array
      items:
        type: string
      description: >
        Required input values not provided. Collect these before generating
        the final output.
    warnings:
      type: array
      items:
        type: string
      description: >
        Notes about assumptions made, content preserved, or TODO markers
        added due to missing information.
  required:
    - mode
    - content
