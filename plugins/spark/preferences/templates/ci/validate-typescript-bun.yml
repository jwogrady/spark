# Cosmic build CI: validate every push and PR with the stack's own tools.
# Placed by `spark preferences --apply` when stack.default resolves to
# typescript-bun; adjust the gates as the project earns them.
name: validate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Profiles differ in which scripts they ship; run each gate the scaffold
      # actually defines — a missing script is not a failure, a failing one is.
      - run: |
          for s in lint test build; do
            if grep -q "\"$s\":" package.json; then bun run "$s"; fi
          done
