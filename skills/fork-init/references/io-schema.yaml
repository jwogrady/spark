input_schema:
  type: object
  properties:
    project_name:
      type: string
      description: The new project directory and GitHub repo name.
    github_owner:
      type: string
      description: The GitHub user or organization that will own the new repo.
    repo_url:
      type: string
      description: SSH or HTTPS remote URL for the new project repo.
    default_branch:
      type: string
      description: The default branch of the new project repo.
      default: main
    output_format:
      type: string
      enum:
        - guided_shell_sequence
        - migration_checklist
        - github_issue
        - claude_code_prompt
        - troubleshooting_guide
      description: The format in which to deliver the workflow guidance.
    error_context:
      type: string
      description: >
        Optional. If the user hit an error, describe it here and the skill
        will produce troubleshooting guidance instead of the standard workflow.
  required: []

output_schema:
  type: object
  properties:
    format:
      type: string
      description: The output format that was produced.
    content:
      type: string
      description: The generated guidance in the requested format.
    missing_inputs:
      type: array
      items:
        type: string
      description: >
        List of required input values that were not provided and must be
        collected from the user before the full output can be generated.
  required:
    - format
    - content
